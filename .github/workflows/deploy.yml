name: Deploy to GitHub Pages

on:
  pull_request:
    paths-ignore:
      - 'yml-scripts/**'
    branches:
      - main
    types:
      - closed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: |
          echo "Listing files in the root directory:"
          ls -la

      - name: Create config.js
        run: |
          echo "export const BIN_ID = '${{ secrets.BIN_ID }}';" > config.js
          echo "export const API_KEY = '${{ secrets.API_KEY }}';" >> config.js

      - name: Debug - Check config.js
        run: |
          echo "Contents of config.js:"
          cat config.js

      - name: Debug - Environment Variables
        run: |
          echo "BIN_ID: ${{ secrets.BIN_ID }}"
          echo "API_KEY: ${{ secrets.API_KEY }}"

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Debug - List Build Output
        run: |
          echo "Listing files in the build directory:"
          ls -la build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"

