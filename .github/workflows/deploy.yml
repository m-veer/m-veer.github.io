name: Deploy to GitHub Pages

# on: [push]
on:
  pull_request:
    paths-ignore:
      - 'yml-scripts/**'
    branches:
      - main
    types:
      - closed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Create config.js
        run: |
          echo "const config = {" > config.js
          echo "  BIN_ID: '${{ secrets.BIN_ID }}'," >> config.js
          echo "  API_KEY: '${{ secrets.API_KEY }}'," >> config.js
          echo "};" >> config.js
      
      # Add steps to build your site here if needed
      # - name: Build site
      #   run: your_build_command_here
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Adjust this to your build output directory if needed

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
