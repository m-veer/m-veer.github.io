name: Build and Deploy
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TOKEN: ${{ secrets.TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          FILE_PATH: ${{ secrets.JSON_FILE_PATH }}
        run: |
          echo "const TOKEN = '$TOKEN';" >> config.js
          echo "const REPO_OWNER = '$REPO_OWNER';" >> config.js
          echo "const REPO_NAME = '$REPO_NAME';" >> config.js
          echo "const FILE_PATH = '$FILE_PATH';" >> config.js
          cat config.js
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.TOKEN }}
          publish_dir: ./dist
